name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this first, so nothing ships without passing it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MULExplorer.slnx

      - name: Build
        run: dotnet build MULExplorer.slnx -c Release --no-restore

      # Runners have no UO client, so data-driven tests skip; file-format, MCP and UI tests still run.
      # Set UO_DATA_FOLDER on a self-hosted runner to run everything.
      - name: Test
        run: >
          dotnet test MULExplorer.Tests/MULExplorer.Tests.csproj -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          retention-days: 7

      # NativeAOT can fail on code that builds and tests fine (trimming,
      # reflection), so make sure the release build still compiles.
      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Add vswhere to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Publish NativeAOT
        run: dotnet publish MULExplorer -c Release -r ${{ matrix.rid }} -p:PublishProfile=NativeAot
